<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTUC Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="brand"><span class="mark">G</span><div><b>GTUC ADMIN</b><small>STORE MANAGEMENT</small></div></div><a href="/">View store</a></header><main class="admin-wrap"><h1>Admin dashboard</h1><section id="login" class="admin-card"><h2>Sign in</h2><form id="loginForm"><label>Username<input id="username" value="admin" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button></form><div id="loginMsg" class="result"></div></section><div id="dashboard" class="hidden"><div class="admin-grid"><section class="admin-card"><h2>Add package</h2><form id="packageForm"><label>Package name<input id="pname" placeholder="e.g. 100 Diamonds" required></label><label>Diamond quantity<input id="diamonds" type="number" min="1" required></label><label>Price in INR<input id="price" type="number" min="1" step=".01" required></label><button>Add package</button></form><div id="pkgMsg" class="result"></div><div id="pkgList"></div></section><section class="admin-card"><h2>Recent orders</h2><div id="orders">Loading…</div></section></div><button id="logout">Log out</button></div></main><script src="/admin.js"></script></body></html>
